server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location ^~ /image/ {
        rewrite ^/image/(.*)$ /$1 break;
        try_files $uri $uri/ /index.html;
    }

    location ^~ /canvas/ {
        rewrite ^/canvas/(.*)$ /$1 break;
        try_files $uri $uri/ /index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 运行期配置由容器启动时生成，禁止缓存，确保改环境变量后即时生效。
    location = /config.js {
        add_header Cache-Control "no-store";
    }
}
